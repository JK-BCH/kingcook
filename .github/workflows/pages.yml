# 와인 대시보드를 GitHub Pages로 배포한다.
#
# - wine-log.md / Top100 데이터 / 빌드 스크립트·템플릿이 main에 푸시되면 자동 배포
# - Actions 탭에서 "Run workflow"로 수동 배포도 가능
# - 배포되는 건 대시보드 한 장(index.html)뿐. 레포의 나머지 파일은 사이트에 올라가지 않는다.
# - 최초 1회: 레포 Settings → Pages → Build and deployment → Source 를 "GitHub Actions"로 설정
name: Deploy wine dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "drinks/wine-log.md"
      - "drinks/ws-top100-*.json"
      - "scripts/build_wine_dashboard.py"
      - "scripts/wine_dashboard_template.html"
      - "scripts/wine_places.json"
      - "scripts/wine_map_base.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 먼저 시작한 것을 끝까지 두고 최신 것만 대기시킨다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 커밋된 dashboard.html이 낡았더라도 항상 로그 기준으로 새로 만든다
      - name: Build dashboard from wine-log
        run: python3 scripts/build_wine_dashboard.py

      - name: Assemble site (dashboard only)
        run: |
          mkdir -p _site
          cp drinks/dashboard.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
